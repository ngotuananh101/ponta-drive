name: frontend
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      # `bun run lint` is intentionally omitted: it fails on pre-existing debt
      # (11 errors: 8 vue/multi-word-component-names in src/components/ui/**,
      # 3 @typescript-eslint/no-explicit-any in src/api/client.ts) that predates
      # the monorepo migration. Re-add this step once that debt is paid.
      - run: bun run test:run
      - run: bun run build
